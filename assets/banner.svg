<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20" />
      <stop offset="50%" stop-color="#15102a" />
      <stop offset="100%" stop-color="#06020f" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        50% { opacity: 0.8; }
        100% { opacity: 0.3; }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .floating-text {
        animation: float 6s ease-in-out infinite;
      }
      .pulsing-glow {
        animation: pulse 4s ease-in-out infinite;
      }
      .rotating-mesh {
        transform-origin: 600px 200px;
        animation: spin 30s linear infinite;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Dynamic Glowing Mesh/Grid -->
  <g class="rotating-mesh" opacity="0.15">
    <circle cx="600" cy="200" r="300" stroke="#7f00ff" stroke-width="1" fill="none" stroke-dasharray="10 15" />
    <circle cx="600" cy="200" r="200" stroke="#00f0ff" stroke-width="1" fill="none" stroke-dasharray="5 10" />
    <circle cx="600" cy="200" r="100" stroke="#ff007f" stroke-width="1" fill="none" stroke-dasharray="2 5" />
    <line x1="300" y1="200" x2="900" y2="200" stroke="#7f00ff" stroke-width="0.5" />
    <line x1="600" y1="-100" x2="600" y2="500" stroke="#7f00ff" stroke-width="0.5" />
  </g>

  <!-- Glowing background blobs -->
  <circle cx="200" cy="150" r="150" fill="#ff007f" opacity="0.15" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="1000" cy="250" r="180" fill="#00f0ff" opacity="0.12" filter="url(#glow)" class="pulsing-glow" />

  <!-- Content -->
  <g class="floating-text" transform="translate(0, 0)">
    <!-- Subtitle -->
    <text x="600" y="140" fill="#00f0ff" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="8" text-anchor="middle" opacity="0.9">CURATED ECOSYSTEM</text>
    
    <!-- Title -->
    <text x="600" y="215" fill="url(#text-grad)" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="2" text-anchor="middle" filter="url(#glow)">AWESOME IMAGE GENERATION AI</text>
    
    <!-- Description -->
    <text x="600" y="270" fill="#ffffff" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16" font-weight="300" letter-spacing="3" text-anchor="middle" opacity="0.7">SaaS Platforms, Open-Source Tools &amp; Local Deployments</text>
  </g>
</svg>
